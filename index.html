<!DOCTYPE html>
<html>
<head>
  <title>Asteroides NASA</title>

  <!-- 🌍 Leaflet mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      font-family: Arial;
      background: radial-gradient(circle at top, #0b0f1a, #05060a);
      color: white;
      text-align: center;
    }

    h1 { margin-top: 25px; }

    .btn {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      margin: 20px;
      font-weight: bold;
    }

    .btn:disabled { opacity: 0.6; }

    table {
      margin: auto;
      width: 85%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    th { background: #1f2a44; }

    .danger { background: rgba(255, 50, 50, 0.15); }
    .safe { background: rgba(50, 255, 120, 0.08); }

    #map {
      height: 350px;
      width: 85%;
      margin: 30px auto;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>☄️ Asteroides cercanos a la Tierra</h1>

<button class="btn" onclick="loadAsteroids()" id="btn">
  🚀 Cargar datos NASA
</button>

<p id="stats"></p>
<p id="status"></p>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Velocidad</th>
      <th>Distancia</th>
      <th>Peligroso</th>
    </tr>
  </thead>
  <tbody id="data"></tbody>
</table>

<div id="map"></div>

<script>

let map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let markers = [];

async function loadAsteroids() {

  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const stats = document.getElementById("stats");
  const table = document.getElementById("data");

  btn.disabled = true;
  status.innerText = "Conectando con NASA... 🌌";

  try {

    const url =
      "https://api.nasa.gov/neo/rest/v1/feed" +
      "?start_date=2024-04-10" +
      "&end_date=2024-04-12" +
      "&api_key=DEMO_KEY";

    const res = await fetch(url);
    const json = await res.json();

    const asteroides = Object.values(json.near_earth_objects).flat();

    asteroides.sort((a, b) =>
      a.close_approach_data[0].miss_distance.kilometers -
      b.close_approach_data[0].miss_distance.kilometers
    );

    table.innerHTML = "";

    let dangerous = 0;
    let safe = 0;

    markers.forEach(m => map.removeLayer(m));
    markers = [];

    asteroides.forEach(a => {

      const speed = a.close_approach_data[0].relative_velocity.kilometers_per_hour;
      const distance = a.close_approach_data[0].miss_distance.kilometers;
      const hazardous = a.is_potentially_hazardous_asteroid;

      if (hazardous) dangerous++;
      else safe++;

      const rowClass = hazardous ? "danger" : "safe";

      table.innerHTML += `
        <tr class="${rowClass}">
          <td>☄️ ${a.name}</td>
          <td>${Number(speed).toLocaleString()} km/h</td>
          <td>${Number(distance).toLocaleString()} km</td>
          <td>${hazardous ? "☠️ Sí" : "🟢 No"}</td>
        </tr>
      `;

      const lat = Math.random() * 140 - 70;
      const lng = Math.random() * 360 - 180;

      const marker = L.circleMarker([lat, lng], {
        radius: hazardous ? 10 : 6,
        color: hazardous ? "red" : "lime"
      }).addTo(map);

      marker.bindPopup(`<b>${a.name}</b>`);

      markers.push(marker);
    });

    stats.innerHTML = `
      ☠️ Peligrosos: ${dangerous} |
      🟢 Seguros: ${safe} |
      🌌 Total: ${asteroides.length}
    `;

    status.innerText = "Datos cargados correctamente ✨";

  } catch (err) {
    console.log(err);
    status.innerText = "Error conectando con NASA ❌";
  }

  btn.disabled = false;
  btn.innerText = "🚀 Cargar datos NASA";
}

</script>

</body>
</html>
